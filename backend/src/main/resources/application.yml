spring:
  application:
    name: moki-rescue-api
  task:
    scheduling:
      pool:
        size: 4
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_MAX_POOL_SIZE:10}
      minimum-idle: ${DB_MIN_IDLE:2}
      connection-timeout: 5000
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:false}
    url: ${SPRING_FLYWAY_URL:${SPRING_DATASOURCE_URL}}
    user: ${SPRING_FLYWAY_USER:${SPRING_DATASOURCE_USERNAME}}
    password: ${SPRING_FLYWAY_PASSWORD:${SPRING_DATASOURCE_PASSWORD}}
    locations: classpath:db/migration
    baseline-on-migrate: false
    clean-disabled: true
    validate-on-migrate: true
    validate-migration-naming: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SUPABASE_URL}/auth/v1
          jwk-set-uri: ${SUPABASE_URL}/auth/v1/.well-known/jwks.json
          audiences: authenticated

app:
  legal:
    current-version: ${TERMS_VERSION:2026-08-22}
  http:
    connect-timeout: 3s
    read-timeout: 8s
    assistant-read-timeout: 12s
  assistant:
    enabled: ${ASSISTANT_ENABLED:true}
    base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-2.5-flash-lite}
    requests-per-minute: ${ASSISTANT_REQUESTS_PER_MINUTE:5}
    requests-per-day: ${ASSISTANT_REQUESTS_PER_DAY:30}
    max-output-tokens: ${ASSISTANT_MAX_OUTPUT_TOKENS:350}
  rate-limit:
    mutations-per-minute: ${API_MUTATIONS_PER_MINUTE:60}
    location-updates-per-minute: ${API_LOCATION_UPDATES_PER_MINUTE:15}
    assistant-attempts-per-minute: ${API_ASSISTANT_ATTEMPTS_PER_MINUTE:10}
  rescue-policy:
    create-window: ${RESCUE_CREATE_WINDOW:10m}
    max-creates-per-window: ${RESCUE_MAX_CREATES_PER_WINDOW:3}
    request-list-limit: ${RESCUE_REQUEST_LIST_LIMIT:100}
    checkpoint-dedupe-seconds: ${PROVIDER_CHECKPOINT_DEDUPE_SECONDS:3}
    late-cancellation-window: ${LATE_CANCELLATION_WINDOW:30d}
    max-late-cancellations: ${MAX_LATE_CANCELLATIONS:3}
    late-cancellation-cooldown: ${LATE_CANCELLATION_COOLDOWN:24h}
    cancellation-evidence-max-age: ${CANCELLATION_EVIDENCE_MAX_AGE:5m}
    arrival-proximity-meters: ${ARRIVAL_PROXIMITY_METERS:150}
    customer-gps-max-accuracy-meters: ${CUSTOMER_GPS_MAX_ACCURACY_METERS:200}
    review-window: ${REVIEW_WINDOW:30d}
  case-lifecycle:
    assigned-start-timeout: ${ASSIGNED_START_TIMEOUT:10m}
    provider-gps-stale-after: ${PROVIDER_GPS_STALE_AFTER:5m}
    arrival-confirmation-timeout: ${ARRIVAL_CONFIRMATION_TIMEOUT:10m}
    quote-decision-timeout: ${QUOTE_DECISION_TIMEOUT:20m}
    completion-confirmation-timeout: ${COMPLETION_CONFIRMATION_TIMEOUT:15m}
    work-progress-timeout: ${WORK_PROGRESS_TIMEOUT:2h}
    customer-retry-cooldown: ${CUSTOMER_RETRY_COOLDOWN:2m}
    max-customer-retries: ${MAX_CUSTOMER_RETRIES:3}
    scan-interval-ms: ${CASE_LIFECYCLE_SCAN_INTERVAL_MS:30000}
  quality:
    minimum-ratings: ${QUALITY_MINIMUM_RATINGS:5}
    warning-average: ${QUALITY_WARNING_AVERAGE:3.5}
    critical-average: ${QUALITY_CRITICAL_AVERAGE:3.0}
    repeat-after-new-ratings: ${QUALITY_REPEAT_AFTER_NEW_RATINGS:3}
    warnings-before-suspension-review: ${QUALITY_WARNINGS_BEFORE_SUSPENSION_REVIEW:3}
    admin-review-list-limit: ${QUALITY_ADMIN_REVIEW_LIST_LIMIT:30}
  routing:
    motorbike-base-url: ${OSRM_MOTORBIKE_BASE_URL}
    profile: ${OSRM_PROFILE:driving}
    max-snap-radius-meters: ${OSRM_MAX_SNAP_RADIUS_METERS:750}
    table-batch-size: ${OSRM_TABLE_BATCH_SIZE:80}
  matching:
    offer-count: ${MATCHING_OFFER_COUNT:3}
    offer-ttl-seconds: ${MATCHING_OFFER_TTL_SECONDS:45}
    provider-location-max-age-seconds: ${PROVIDER_LOCATION_MAX_AGE_SECONDS:180}
    provider-location-max-accuracy-meters: ${PROVIDER_LOCATION_MAX_ACCURACY_METERS:150}
    expiry-scan-interval-ms: ${MATCHING_EXPIRY_SCAN_INTERVAL_MS:15000}
  push:
    expo-url: ${EXPO_PUSH_URL:https://exp.host/--/api/v2/push/send}
    receipt-url: ${EXPO_PUSH_RECEIPT_URL:https://exp.host/--/api/v2/push/getReceipts}
    access-token: ${EXPO_ACCESS_TOKEN:}
    send-initial-backoff: ${PUSH_SEND_INITIAL_BACKOFF:1s}
    send-max-attempts: ${PUSH_SEND_MAX_ATTEMPTS:3}
    receipt-initial-delay: ${PUSH_RECEIPT_INITIAL_DELAY:15m}
    receipt-retry-delay: ${PUSH_RECEIPT_RETRY_DELAY:5m}
    receipt-max-age: ${PUSH_RECEIPT_MAX_AGE:23h}
    receipt-max-attempts: ${PUSH_RECEIPT_MAX_ATTEMPTS:6}
    receipt-batch-size: ${PUSH_RECEIPT_BATCH_SIZE:1000}
    receipt-scan-interval-ms: ${PUSH_RECEIPT_SCAN_INTERVAL_MS:60000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8081,http://localhost:19006}

server:
  port: ${PORT:8080}
  error:
    include-message: never

logging:
  pattern:
    level: "%5p [requestId:%X{requestId:-}]"
  level:
    root: INFO
    org.springframework.security: INFO
