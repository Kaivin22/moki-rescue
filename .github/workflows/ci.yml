name: CI - Moki Rescue validation

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '20.19.x'
  APP_ENV: production
  EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
  EXPO_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
  EXPO_PUBLIC_API_URL: https://api.example.com
  EXPO_PUBLIC_EAS_PROJECT_ID: 00000000-0000-4000-8000-000000000000
  EXPO_PUBLIC_SUPPORT_HOTLINE: '19000000'
  EXPO_PUBLIC_SERVICE_CENTER_LATITUDE: '16.0544'
  EXPO_PUBLIC_SERVICE_CENTER_LONGITUDE: '108.2022'
  GOOGLE_MAPS_KEY: ci-placeholder

jobs:
  validate:
    name: Mobile, backend and security
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install locked dependencies
        run: npm ci
      - name: Verify Docker for database integration tests
        run: docker info
      - name: Run backend tests
        working-directory: backend
        # Repository is maintained on Windows, so do not rely on the POSIX
        # executable bit being preserved for the Maven wrapper.
        run: bash ./mvnw --batch-mode --no-transfer-progress test
      # SDK 54 currently has known high advisories in its Metro build toolchain.
      # Keep them visible, but block critical findings without forcing an SDK jump.
      - name: Audit locked dependencies (critical gate)
        run: npm audit --audit-level=critical
      - name: Reject common committed secret formats
        shell: bash
        run: |
          if git grep -n -I -E '(AIza[0-9A-Za-z_-]{30,}|sb_secret_[0-9A-Za-z_-]+|ghp_[0-9A-Za-z]{30,}|github_pat_[0-9A-Za-z_]+|sk-(proj-)?[0-9A-Za-z_-]{20,}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----)' -- . ':(exclude)package-lock.json' ':(exclude).github/workflows/ci.yml'; then
            echo 'Potential secret committed to the repository.'
            exit 1
          fi
      - name: Run ESLint
        run: npm run lint
      - name: Check source formatting
        run: npm run format:check
      - name: Run TypeScript type-check
        run: npm run typecheck
      - name: Run frontend tests
        run: npm run test:ci
      - name: Validate Expo public configuration
        run: npx expo config --type public
      - name: Validate Expo package versions
        run: npx expo install --check
      - name: Export Android, iOS and web bundles
        run: npx expo export --platform all --output-dir dist
      - name: Upload Expo export from main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: expo-export-${{ github.sha }}
          path: dist
          retention-days: 14
