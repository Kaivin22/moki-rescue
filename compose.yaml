name: danang-rescue
services:
  osrm:
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1@sha256:855614a38f464b0558a2ad6eaa7cb8c139f39887da9b38b485ce453c6e6e6124
    command: [osrm-routed, --algorithm, mld, --ip, 0.0.0.0, --port, "5000", --threads, "2", /data/map.osrm]
    volumes:
      - type: bind
        source: ${OSRM_DATA_DIR:?Set OSRM_DATA_DIR to the existing processed map directory}
        target: /data
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "127.0.0.1:${OSRM_HOST_PORT:-5001}:5000"
    mem_limit: 1g
    cpus: 2
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
  backend:
    image: danang-rescue-backend:local
    build:
      context: ./backend
    env_file:
      - .env.docker.local
    environment:
      PORT: "8080"
      OSRM_MOTORBIKE_BASE_URL: http://osrm:5000
      SPRING_FLYWAY_ENABLED: "false"
    ports:
      - "${BACKEND_BIND_ADDRESS:-127.0.0.1}:${BACKEND_HOST_PORT:-8082}:8080"
    depends_on:
      osrm:
        condition: service_started
    mem_limit: 768m
    cpus: 2
    read_only: true
    tmpfs: ["/tmp:size=128m,mode=1777"]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: [CMD, curl, --fail, --silent, --max-time, "5", http://localhost:8080/api/health/ready]
      interval: 20s
      timeout: 6s
      start_period: 60s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
